<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a45"/>
      <stop offset="1" stop-color="#3d5c55"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9cf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f7e9cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87b55"/>
      <stop offset="1" stop-color="#7c5537"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c56a48"/>
      <stop offset=".55" stop-color="#b4583a"/>
      <stop offset="1" stop-color="#8e3f27"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bccdc2"/>
      <stop offset=".55" stop-color="#9fb5a8"/>
      <stop offset="1" stop-color="#7d978a"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf5ec"/>
      <stop offset=".6" stop-color="#ede4d6"/>
      <stop offset="1" stop-color="#cfc3b2"/>
    </linearGradient>
    <linearGradient id="ochre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b45f"/>
      <stop offset=".6" stop-color="#d09c42"/>
      <stop offset="1" stop-color="#a87a2c"/>
    </linearGradient>
  </defs>
  <rect width="880" height="330" fill="url(#wall)"/>
  <!-- window light falling on the wall -->
  <polygon points="520,0 880,0 880,250 690,250" fill="url(#light)"/>
  <!-- shelf -->
  <rect x="0" y="252" width="880" height="18" fill="url(#wood)"/>
  <rect x="0" y="270" width="880" height="60" fill="#22362f"/>
  <ellipse cx="440" cy="252" rx="440" ry="3" fill="#000" opacity=".15"/>

  <!-- tall clay bottle -->
  <ellipse cx="150" cy="252" rx="48" ry="6" fill="#000" opacity=".25"/>
  <path d="M138 70 h24 v40 c0 18 40 40 40 92 c0 30 -18 50 -52 50 c-34 0 -52 -20 -52 -50 c0 -52 40 -74 40 -92 z" fill="url(#clay)"/>
  <ellipse cx="150" cy="70" rx="12" ry="3" fill="#6f2f1c"/>
  <path d="M104 180 q46 12 92 0" stroke="#f4efe7" stroke-opacity=".35" stroke-width="3" fill="none"/>

  <!-- round sage moon jar -->
  <ellipse cx="275" cy="252" rx="58" ry="7" fill="#000" opacity=".25"/>
  <path d="M250 140 h50 c40 14 56 44 56 70 c0 26 -24 42 -81 42 c-57 0 -81 -16 -81 -42 c0 -26 16 -56 56 -70 z" fill="url(#sage)"/>
  <ellipse cx="275" cy="140" rx="25" ry="5" fill="#5d7569"/>

  <!-- branch in the moon jar -->
  <path d="M272 140 C 262 100 250 70 228 40" stroke="#5a3e2b" stroke-width="3" fill="none"/>
  <path d="M262 100 C 280 80 300 66 318 58" stroke="#5a3e2b" stroke-width="2.5" fill="none"/>
  <g fill="#c7d8a8">
    <ellipse cx="232" cy="48" rx="12" ry="5" transform="rotate(-35 232 48)"/>
    <ellipse cx="246" cy="66" rx="12" ry="5" transform="rotate(30 246 66)"/>
    <ellipse cx="300" cy="64" rx="12" ry="5" transform="rotate(-20 300 64)"/>
    <ellipse cx="318" cy="56" rx="11" ry="4.5" transform="rotate(15 318 56)"/>
    <ellipse cx="256" cy="88" rx="11" ry="4.5" transform="rotate(-40 256 88)"/>
  </g>

  <!-- small bone cups stack -->
  <ellipse cx="400" cy="252" rx="34" ry="5" fill="#000" opacity=".25"/>
  <path d="M370 212 h60 l-6 40 h-48 z" fill="url(#bone)"/>
  <path d="M374 176 h52 l-5 34 h-42 z" fill="url(#bone)"/>
  <ellipse cx="400" cy="176" rx="26" ry="4" fill="#b8ab98"/>
  <rect x="370" y="210" width="60" height="3" fill="#cfc3b2"/>

  <!-- wide ochre bowl -->
  <ellipse cx="520" cy="252" rx="70" ry="7" fill="#000" opacity=".25"/>
  <path d="M446 200 h148 c-6 34 -34 52 -74 52 c-40 0 -68 -18 -74 -52 z" fill="url(#ochre)"/>
  <ellipse cx="520" cy="200" rx="74" ry="9" fill="#8a6222"/>
  <ellipse cx="520" cy="198" rx="70" ry="6" fill="#efc879" opacity=".5"/>

  <!-- tall bone vase with speckles -->
  <ellipse cx="660" cy="252" rx="40" ry="6" fill="#000" opacity=".25"/>
  <path d="M640 92 h40 c-4 20 -8 30 8 60 c18 34 22 66 12 84 c-6 12 -18 16 -40 16 c-22 0 -34 -4 -40 -16 c-10 -18 -6 -50 12 -84 c16 -30 12 -40 8 -60 z" fill="url(#bone)"/>
  <ellipse cx="660" cy="92" rx="20" ry="4" fill="#b8ab98"/>
  <g fill="#7b6a58" opacity=".5">
    <circle cx="650" cy="170" r="1.6"/><circle cx="668" cy="190" r="1.4"/><circle cx="640" cy="210" r="1.5"/>
    <circle cx="676" cy="222" r="1.3"/><circle cx="657" cy="236" r="1.6"/><circle cx="684" cy="180" r="1.2"/>
    <circle cx="646" cy="146" r="1.2"/><circle cx="663" cy="128" r="1.3"/>
  </g>

  <!-- dark clay pitcher -->
  <ellipse cx="785" cy="252" rx="46" ry="6" fill="#000" opacity=".25"/>
  <path d="M818 170 c26 4 26 46 0 52" stroke="#6f2f1c" stroke-width="8" fill="none"/>
  <path d="M752 150 l-10 -10 h76 v12 c8 20 8 70 0 90 c-6 8 -18 10 -33 10 c-15 0 -27 -2 -33 -10 c-8 -20 -8 -70 0 -92 z" fill="url(#clay)"/>
  <path d="M742 140 h76" stroke="#6f2f1c" stroke-width="4"/>
</svg>
