  <path d="M0 230 C 60 210 110 250 170 240 C 220 232 240 280 300 330 H0 Z" fill="#c9d6b9"/>
  <path d="M380 0 C 400 40 450 50 470 90 C 490 130 540 130 540 130 V0 Z" fill="#c9d6b9"/>
  <path d="M420 330 C 440 290 500 280 540 250 V330 Z" fill="#b9d0d6"/>
  <!-- city blocks -->
  <g fill="#ddd3c3">
    <rect x="30" y="30" width="90" height="60" rx="4"/>
    <rect x="140" y="30" width="80" height="60" rx="4"/>
    <rect x="30" y="112" width="90" height="70" rx="4"/>
    <rect x="250" y="40" width="100" height="50" rx="4"/>
    <rect x="250" y="190" width="90" height="60" rx="4"/>
    <rect x="370" y="160" width="70" height="70" rx="4"/>
    <rect x="460" y="160" width="60" height="60" rx="4"/>
  </g>
  <!-- the building (Karaportti 2) -->
  <rect x="140" y="112" width="80" height="70" rx="4" fill="#d9b8a4"/>
  <!-- railway -->
  <path d="M0 106 H540" stroke="#9a8f80" stroke-width="5"/>
  <path d="M0 106 H540" stroke="#ece5d9" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- roads -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M235 0 V330" stroke-width="12"/>
    <path d="M0 200 C 120 196 200 190 235 186 C 300 178 380 150 540 146" stroke-width="10"/>
    <path d="M130 0 V100 M130 112 V230" stroke-width="7"/>
    <path d="M360 100 V330" stroke-width="7"/>
    <path d="M235 270 H420" stroke-width="7"/>
  </g>
  <path d="M235 0 V330" stroke="#e2b45f" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3a332c">
    <text x="243" y="20">Kehä I</text>
    <text x="440" y="99">Rantarata</text>
    <text x="22" y="216">Karaportti</text>
    <text x="30" y="290" fill="#3e5a2d">Park</text>
    <text x="470" y="312" fill="#2f5560">Bay</text>
  </g>
  <!-- marker -->
  <ellipse cx="180" cy="152" rx="10" ry="3.5" fill="#000" opacity=".25"/>
  <path d="M180 152 C 172 136 162 128 162 116 A18 18 0 1 1 198 116 C 198 128 188 136 180 152 Z" fill="#b4583a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="180" cy="115" r="6" fill="#ffffff"/>
  <rect x="200" y="122" width="96" height="24" rx="5" fill="#2f4a45"/>
  <text x="248" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Karaportti 2</text>
