<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b4583a"/>
      <stop offset="1" stop-color="#93452c"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfd0"/>
      <stop offset="1" stop-color="#d6c8b4"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d5c55"/><stop offset="1" stop-color="#253a35"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf5ec"/><stop offset="1" stop-color="#d9cdbb"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bccdc2"/><stop offset="1" stop-color="#7d978a"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b45f"/><stop offset="1" stop-color="#a87a2c"/>
    </linearGradient>
  </defs>
  <rect width="880" height="230" fill="url(#bg)"/>
  <circle cx="760" cy="40" r="120" fill="#c56a48" opacity=".45"/>
  <circle cx="90" cy="20" r="80" fill="#8e3f27" opacity=".35"/>
  <rect y="168" width="880" height="62" fill="url(#table)"/>
  <rect y="166" width="880" height="4" fill="#c4b49c"/>

  <!-- mug 1 (forest) -->
  <ellipse cx="120" cy="170" rx="44" ry="6" fill="#000" opacity=".2"/>
  <path d="M152 112 c30 0 30 44 0 44" stroke="#253a35" stroke-width="9" fill="none"/>
  <path d="M84 96 h72 v62 q0 12 -12 12 h-48 q-12 0 -12 -12 z" fill="url(#g1)"/>
  <ellipse cx="120" cy="96" rx="36" ry="6" fill="#1b2b27"/>

  <!-- plate stack -->
  <ellipse cx="260" cy="170" rx="74" ry="7" fill="#000" opacity=".2"/>
  <rect x="190" y="152" width="140" height="10" rx="5" fill="url(#g2)"/>
  <rect x="194" y="142" width="132" height="10" rx="5" fill="url(#g3)"/>
  <rect x="190" y="132" width="140" height="10" rx="5" fill="url(#g2)"/>
  <rect x="196" y="122" width="128" height="10" rx="5" fill="url(#g4)"/>
  <rect x="198" y="162" width="124" height="6" rx="3" fill="#cfc3b2"/>

  <!-- tall sage vase -->
  <ellipse cx="420" cy="170" rx="40" ry="6" fill="#000" opacity=".2"/>
  <path d="M404 40 h32 v20 c0 16 30 30 30 66 c0 28 -14 42 -46 42 c-32 0 -46 -14 -46 -42 c0 -36 30 -50 30 -66 z" fill="url(#g3)"/>
  <ellipse cx="420" cy="40" rx="16" ry="3.5" fill="#5d7569"/>
  <path d="M378 120 q42 10 84 0" stroke="#f4efe7" stroke-opacity=".45" stroke-width="3" fill="none"/>

  <!-- ochre bowl -->
  <ellipse cx="545" cy="170" rx="62" ry="6" fill="#000" opacity=".2"/>
  <path d="M480 118 h130 c-4 34 -30 50 -65 50 c-35 0 -61 -16 -65 -50 z" fill="url(#g4)"/>
  <ellipse cx="545" cy="118" rx="65" ry="8" fill="#8a6222"/>

  <!-- bone mug -->
  <ellipse cx="680" cy="170" rx="40" ry="6" fill="#000" opacity=".2"/>
  <path d="M708 116 c26 0 26 38 0 38" stroke="#cfc3b2" stroke-width="8" fill="none"/>
  <path d="M648 104 h64 l-4 56 q-1 10 -11 10 h-34 q-10 0 -11 -10 z" fill="url(#g2)"/>
  <ellipse cx="680" cy="104" rx="32" ry="5" fill="#b8ab98"/>
  <path d="M650 128 h60" stroke="#2f4a45" stroke-width="5"/>

  <!-- small forest cup -->
  <ellipse cx="790" cy="170" rx="30" ry="5" fill="#000" opacity=".2"/>
  <path d="M764 126 h52 l-6 38 q-1 6 -7 6 h-26 q-6 0 -7 -6 z" fill="url(#g1)"/>
  <ellipse cx="790" cy="126" rx="26" ry="4" fill="#1b2b27"/>
</svg>
